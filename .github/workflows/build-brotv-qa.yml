name: Build BRO TV QA

on:
  push:
    branches: [ qa-apk-3.1.0 ]
  workflow_dispatch:

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage share
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://firestorage.ai/ja/f/etjN4JxWE3PV'
          curl -LfsS -D /tmp/headers.txt "$URL" -o /tmp/share.html
          echo '=== HEADERS ==='
          cat /tmp/headers.txt
          echo '=== FILE TYPE ==='
          file /tmp/share.html
          wc -c /tmp/share.html
          echo '=== LINKS ==='
          python3 - <<'PY'
          import re
          s=open('/tmp/share.html','r',encoding='utf-8',errors='replace').read()
          for x in sorted(set(re.findall(r'https?://[^\"\'<> ]+|href=[\"\']([^\"\']+)', s))):
              print(x)
          print('=== ZIP/DOWNLOAD CONTEXT ===')
          for m in re.finditer(r'(?i)(zip|download|file_id|public_id|BROTV)', s):
              a=max(0,m.start()-180); b=min(len(s),m.end()+300)
              print(s[a:b].replace('\n',' '))
          PY
